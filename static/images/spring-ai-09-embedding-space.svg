<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="qarrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#dc2626" stroke-width="1.6"/>
    </marker>
  </defs>

  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Text as points in embedding space</text>
  <text x="380" y="52" text-anchor="middle" font-size="13" fill="#64748b">Similar meaning lands close together. A query finds its nearest neighbours.</text>

  <circle cx="70" cy="95" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="84" y="91" font-size="12" font-weight="600" fill="#b45309">query: "how do I return a broken blender?"</text>

  <line x1="55" y1="510" x2="720" y2="510" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="55" y1="140" x2="55" y2="510" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="715" y="530" text-anchor="end" font-size="11" fill="#94a3b8">dimension 1 (of hundreds)</text>
  <text x="45" y="150" text-anchor="end" font-size="11" fill="#94a3b8" transform="rotate(-90 45 150)">dimension 2</text>

  <ellipse cx="235" cy="270" rx="130" ry="80" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="235" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">returns &amp; refunds</text>
  <circle cx="205" cy="250" r="5" fill="#2563eb"/>
  <text x="216" y="250" font-size="11" fill="#1e3a8a">"return a damaged item"</text>
  <circle cx="207" cy="270" r="5" fill="#2563eb"/>
  <text x="216" y="272" font-size="11" fill="#1e3a8a">"refund policy"</text>
  <circle cx="207" cy="290" r="5" fill="#2563eb"/>
  <text x="216" y="290" font-size="11" fill="#1e3a8a">"send it back"</text>

  <line x1="80" y1="105" x2="197" y2="243" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#qarrow)"/>
  <text x="95" y="185" font-size="10" fill="#dc2626" font-style="italic">nearest</text>

  <ellipse cx="560" cy="285" rx="130" ry="82" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="560" y="225" text-anchor="middle" font-size="12" font-weight="600" fill="#166534">shipping &amp; delivery</text>
  <circle cx="540" cy="275" r="5" fill="#16a34a"/>
  <text x="550" y="275" font-size="11" fill="#166534">"where is my package"</text>
  <circle cx="540" cy="292" r="5" fill="#16a34a"/>
  <text x="550" y="295" font-size="11" fill="#166534">"delivery time"</text>
  <circle cx="540" cy="312" r="5" fill="#16a34a"/>
  <text x="550" y="314" font-size="11" fill="#166534">"shipping cost"</text>

  <ellipse cx="360" cy="440" rx="130" ry="68" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
  <text x="360" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b">billing &amp; payment</text>
  <circle cx="340" cy="425" r="5" fill="#b91c1c"/>
  <text x="346" y="430" font-size="11" fill="#991b1b">"charged twice"</text>
  <circle cx="340" cy="448" r="5" fill="#b91c1c"/>
  <text x="346" y="452" font-size="11" fill="#991b1b">"payment failed"</text>
  <circle cx="340" cy="465" r="5" fill="#b91c1c"/>
  <text x="346" y="470" font-size="11" fill="#991b1b">"invoice question"</text>
</svg>
